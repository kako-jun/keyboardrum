[package]
name = "keyboardrum"
version = "0.1.0"
description = "Typing-resident drum kit — your keyboard zones become a drum kit"
authors = ["kako-jun"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
